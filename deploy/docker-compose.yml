# oonfeeWRT controller — self-hosted, Omada-style.
#
#   docker compose up -d
#   open http://<this-host>:8080
#
# NETWORKING — pick one, understand the tradeoff (ARCHITECTURE, deployment):
#
#   network_mode: host   (default below, Linux only)
#     Full discovery: subnet TCP probe + ARP + mDNS. The controller sees the
#     LAN the way a program on the host does. Port 8080 is bound directly on
#     the host — no `ports:` mapping is used or needed.
#
#   bridge + ports mapping   (comment host mode out, uncomment `ports:`)
#     Works everywhere including Docker Desktop. Subnet TCP probing still
#     works (it's plain L3); ARP/mDNS discovery does not cross the bridge —
#     adopt devices by IP, which the UI treats as a first-class path.

services:
  oonfeewrt:
    image: oonfeewrt:dev            # built via deploy/Dockerfile
    container_name: oonfeewrt
    restart: unless-stopped

    network_mode: host              # Linux: full discovery (recommended)
    # ports:                        # bridge-mode alternative:
    #   - "8080:8080"

    volumes:
      - oonfee-data:/data           # SQLite DB, keyring and backups
      # Bind mounts keep the host's uid/gid, so a correctly-secured 0600 secret
      # owned by your account is unreadable by the container's uid 65532 and
      # argon2id key derivation fails at startup. Before first run:
      #     chown 65532 deploy/passphrase && chmod 600 deploy/passphrase
      - type: bind
        source: ./passphrase
        target: /run/secrets/oonfee-passphrase
        read_only: true
        bind:
          create_host_path: false   # missing secret is an error, not a new directory

    environment:
      OONFEE_DATA_DIR: /data
      OONFEE_LISTEN: ":8080"
      # Secrets come from files, never env values (IMPLEMENTATION §11):
      OONFEE_PASSPHRASE_FILE: /run/secrets/oonfee-passphrase

    # Matches the image's non-root user. Note this only sets the process uid —
    # it does not chown anything; the image ships /data already owned by 65532.
    user: "65532:65532"

    # The only writable paths are the controller volume and SQLite's temporary
    # directory. The process needs no Linux capabilities or privilege gain.
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,uid=65532,gid=65532,mode=0700
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

    healthcheck:
      test: ["CMD", "/oonfeewrtd", "-healthcheck"]   # hits /healthz internally
      interval: 30s
      timeout: 5s
      retries: 3

    # Give SIGTERM room to finish an in-flight apply/confirm cycle before the
    # container is killed — never orphan a device with a rollback timer running
    # (IMPLEMENTATION §11, graceful shutdown).
    stop_grace_period: 150s

volumes:
  oonfee-data:
