# oonfeeWRT controller — self-hosted network management.
#
#   docker compose up -d
#   open http://127.0.0.1:8080 on the controller host
#
# NETWORKING — the safe, portable bridge mode is the default:
#
#   Bridge mode works everywhere, including Docker Desktop. HTTP is exposed
#   only on host loopback. Subnet TCP probing still works; ARP/mDNS discovery
#   does not cross the bridge, so adopt devices by IP.
#
# Linux-only host networking is an explicit discovery opt-in. Remove `ports:`,
# add `network_mode: host`, and put TLS/firewall policy in front of port 8080.
# Host mode exposes the daemon's `:8080` listener directly on host interfaces.

services:
  oonfeewrt:
    image: ghcr.io/aiden0rchad/oonfeewrt:v0.1.0
    container_name: oonfeewrt
    restart: unless-stopped

    ports:
      - "127.0.0.1:8080:8080"

    volumes:
      - oonfee-data:/data           # SQLite DB, keyring and backups
      # Bind mounts keep the host's uid/gid, so a correctly-secured 0600 secret
      # owned by your account is unreadable by the container's uid 65532 and
      # argon2id key derivation fails at startup. Before first run:
      #     sudo chown 65532:65532 passphrase && sudo chmod 600 passphrase
      - type: bind
        source: ./passphrase
        target: /run/secrets/oonfee-passphrase
        read_only: true
        bind:
          create_host_path: false   # missing secret is an error, not a new directory

    environment:
      OONFEE_DATA_DIR: /data
      OONFEE_LISTEN: ":8080"
      # Secrets come from files, never env values (IMPLEMENTATION §11):
      OONFEE_PASSPHRASE_FILE: /run/secrets/oonfee-passphrase

    # Matches the image's non-root user. Note this only sets the process uid —
    # it does not chown anything; the image ships /data already owned by 65532.
    user: "65532:65532"

    # The only writable paths are the controller volume and SQLite's temporary
    # directory. The process needs no Linux capabilities or privilege gain.
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,uid=65532,gid=65532,mode=0700
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

    healthcheck:
      test: ["CMD", "/oonfeewrtd", "-healthcheck"]   # hits /healthz internally
      interval: 30s
      timeout: 5s
      retries: 3

    # Give SIGTERM room to finish an in-flight apply/confirm cycle before the
    # container is killed — never orphan a device with a rollback timer running
    # (IMPLEMENTATION §11, graceful shutdown).
    stop_grace_period: 150s

volumes:
  oonfee-data:
