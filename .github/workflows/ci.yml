name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  go:
    name: Go / test, vet, modules
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.sum
      - name: Verify modules
        run: go mod verify
      - name: Check module tidiness
        run: go mod tidy -diff
      - name: Test
        run: go test -count=1 ./...
      - name: Vet
        run: go vet ./...
      - name: Scan dependencies
        run: |
          GOBIN="$RUNNER_TEMP/bin" go install golang.org/x/vuln/cmd/govulncheck@v1.7.0
          "$RUNNER_TEMP/bin/govulncheck" ./...

  go-race:
    name: Go / race
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.sum
      - name: Test with race detector
        run: go test -race -count=1 ./...

  ui:
    name: UI / test, build, budget
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - name: Use supported npm audit client
        run: npm install --global npm@11.6.4
      - name: Install dependencies
        run: npm --prefix ui ci
      - name: Install pinned browser
        run: npm --prefix ui run test:browser:install
      - name: Test
        run: |
          npm --prefix ui test
          npm --prefix ui run test:browser
      - name: Audit dependencies
        run: npm --prefix ui audit --audit-level=high
      - name: Build
        run: npm --prefix ui run build
      - name: Check bundle budget
        run: ./tools/budget_check.sh

  release-build:
    name: Release / build
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.sum
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - name: Use supported npm audit client
        run: npm install --global npm@11.6.4
      - name: Build and verify archives
        run: |
          ./tools/reproducible-build-check.sh v0.0.0-ci
          ./tools/release-build.sh v0.0.0-ci "$RUNNER_TEMP/release"
          (cd "$RUNNER_TEMP/release" && sha256sum --check SHA256SUMS)
          mkdir "$RUNNER_TEMP/release-extract"
          tar -xzf "$RUNNER_TEMP/release/oonfeewrt_0.0.0-ci_linux_amd64.tar.gz" \
            -C "$RUNNER_TEMP/release-extract"
          test "$("$RUNNER_TEMP/release-extract/oonfeewrt_0.0.0-ci_linux_amd64/oonfeewrtd" -version)" = v0.0.0-ci
          test -x "$RUNNER_TEMP/release-extract/oonfeewrt_0.0.0-ci_linux_amd64/oonfeewrt-recoverycheck"
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
      - name: Test backup and restore in a clean container
        run: ./tools/release-container-smoke.sh v0.0.0-ci
      - name: Build multi-platform image without publishing
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: deploy/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: false
          outputs: type=oci,dest=${{ runner.temp }}/oonfeewrt.oci.tar
          build-args: VERSION=v0.0.0-ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

  secrets:
    name: Security / secret scan
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out complete history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.sum
      - name: Run repository-specific secret checks
        run: ./tools/secret-scan.sh
      - name: Scan complete tree and history with Gitleaks
        run: ./tools/full-secret-scan.sh
