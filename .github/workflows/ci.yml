name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - codex/nightly-issue25-wired-topology

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/codex/nightly-issue25-wired-topology' }}

jobs:
  go:
    name: Go / test, vet, modules
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.sum
      - name: Verify modules
        run: go mod verify
      - name: Check module tidiness
        run: go mod tidy -diff
      - name: Test
        run: go test -count=1 ./...
      - name: Vet
        run: go vet ./...
      - name: Scan dependencies
        run: |
          GOBIN="$RUNNER_TEMP/bin" go install golang.org/x/vuln/cmd/govulncheck@v1.7.0
          "$RUNNER_TEMP/bin/govulncheck" ./...

  go-race:
    name: Go / race
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.sum
      - name: Test with race detector
        run: go test -race -count=1 ./...

  ui:
    name: UI / test, build, budget
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - name: Install dependencies
        run: npm --prefix ui ci
      - name: Install pinned browser
        run: npm --prefix ui run test:browser:install
      - name: Test
        run: |
          npm --prefix ui test
          npm --prefix ui run test:browser
      - name: Audit dependencies
        run: npm --prefix ui audit --audit-level=high
      - name: Build
        run: npm --prefix ui run build
      - name: Check bundle budget
        run: ./tools/budget_check.sh

  release-build:
    name: Release / build
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.sum
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - name: Build and verify archives
        run: |
          ./tools/reproducible-build-check.sh v0.0.0-ci
          ./tools/release-build.sh v0.0.0-ci "$RUNNER_TEMP/release"
          (cd "$RUNNER_TEMP/release" && sha256sum --check SHA256SUMS)
          mkdir "$RUNNER_TEMP/release-extract"
          tar -xzf "$RUNNER_TEMP/release/oonfeewrt_0.0.0-ci_linux_amd64.tar.gz" \
            -C "$RUNNER_TEMP/release-extract"
          test "$("$RUNNER_TEMP/release-extract/oonfeewrt_0.0.0-ci_linux_amd64/oonfeewrtd" -version)" = v0.0.0-ci
          test -x "$RUNNER_TEMP/release-extract/oonfeewrt_0.0.0-ci_linux_amd64/oonfeewrt-recoverycheck"
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
      - name: Test backup and restore in a clean container
        run: ./tools/release-container-smoke.sh v0.0.0-ci
      - name: Build multi-platform image without publishing
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: deploy/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: false
          outputs: type=oci,dest=${{ runner.temp }}/oonfeewrt.oci.tar
          build-args: VERSION=v0.0.0-ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

  secrets:
    name: Security / secret scan
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out complete history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.sum
      - name: Run repository-specific secret checks
        run: ./tools/secret-scan.sh
      - name: Scan complete tree and history with Gitleaks
        run: ./tools/full-secret-scan.sh

  nightly-container:
    name: Nightly / issue 25 wired topology container
    if: github.event_name == 'push' && github.ref == 'refs/heads/codex/nightly-issue25-wired-topology'
    needs: [go, go-race, ui, release-build, secrets]
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - name: Check out exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Set image coordinates
        id: image
        env:
          REPOSITORY: ${{ github.repository }}
        run: |
          short_sha="${GITHUB_SHA::12}"
          tag="nightly-issue25-wired-topology-$short_sha"
          image="ghcr.io/${REPOSITORY,,}"
          echo "name=$image" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "ref=$image:$tag" >> "$GITHUB_OUTPUT"
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
      - name: Sign in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Build and publish test image
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: deploy/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.image.outputs.ref }}
          build-args: VERSION=${{ steps.image.outputs.tag }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ steps.image.outputs.tag }}
            org.opencontainers.image.ref.name=codex/nightly-issue25-wired-topology
            org.opencontainers.image.description=Unreleased issue 25 topology test build; not a stable release
          provenance: mode=max
          sbom: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Sign and verify image digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          IMAGE: ${{ steps.image.outputs.name }}
        run: |
          identity="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/.github/workflows/ci.yml@$GITHUB_REF"
          cosign sign --yes "$IMAGE@$DIGEST"
          cosign verify \
            --certificate-identity "$identity" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            "$IMAGE@$DIGEST" >/dev/null
      - name: Verify public multi-platform test image
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          IMAGE_REF: ${{ steps.image.outputs.ref }}
          VERSION: ${{ steps.image.outputs.tag }}
        run: |
          anonymous=$(mktemp -d)
          inspect="$RUNNER_TEMP/oonfeewrt-nightly-image.txt"
          trap 'rm -rf "$anonymous"' EXIT
          for attempt in 1 2 3 4 5 6; do
            if DOCKER_CONFIG="$anonymous" docker buildx imagetools inspect \
              "$IMAGE_REF" > "$inspect"; then
              break
            fi
            if [ "$attempt" -eq 6 ]; then
              echo "nightly: image is not anonymously readable: $IMAGE_REF" >&2
              exit 1
            fi
            sleep 5
          done
          grep -Eq "^Digest:[[:space:]]+$DIGEST([[:space:]]|$)" "$inspect"
          grep -Eq 'Platform:[[:space:]]+linux/amd64([[:space:]]|$)' "$inspect"
          grep -Eq 'Platform:[[:space:]]+linux/arm64([[:space:]]|$)' "$inspect"
          test "$(DOCKER_CONFIG="$anonymous" docker run --rm --platform linux/amd64 \
            "$IMAGE_REF@$DIGEST" -version)" = "$VERSION"
          {
            echo "### Unreleased issue #25 test image"
            echo
            echo "\`$IMAGE_REF@$DIGEST\`"
            echo
            echo "- This is not v0.1.4 and does not update stable/latest tags."
            echo "- It migrates controller data to schema 20. Restore a verified portable backup into a separate test volume; do not use the only live v0.1.3 volume."
            echo "- Stop the stable controller while this candidate polls the same routers."
            echo "- Existing adopted routers need an acknowledged controller-access refresh only if router-clock status is being tested."
          } >> "$GITHUB_STEP_SUMMARY"
