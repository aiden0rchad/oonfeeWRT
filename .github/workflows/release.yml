name: Release

on:
  push:
    tags:
      - "v*"

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  gate:
    name: Exact-SHA release gate
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Check out tagged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Require SemVer tag on main
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          semver='^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-((0|[1-9][0-9]*|[0-9]*[A-Za-z-][0-9A-Za-z-]*)(\.(0|[1-9][0-9]*|[0-9]*[A-Za-z-][0-9A-Za-z-]*))*))?$'
          [[ "$REF_NAME" =~ $semver ]] || {
            echo "release: tag is not strict SemVer without build metadata: $REF_NAME" >&2
            exit 1
          }
          git merge-base --is-ancestor "$GITHUB_SHA" refs/remotes/origin/main || {
            echo "release: tagged commit is not on main" >&2
            exit 1
          }
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.sum
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - name: Verify Go modules
        run: |
          go mod verify
          go mod tidy -diff
      - name: Test and vet Go
        run: |
          go test -count=1 ./...
          go vet ./...
      - name: Test Go with race detector
        run: go test -race -count=1 ./...
      - name: Install and test UI
        run: |
          npm --prefix ui ci
          npm --prefix ui test
      - name: Audit UI dependencies
        run: npm --prefix ui audit --audit-level=high
      - name: Build UI and check budget
        run: |
          npm --prefix ui run build
          ./tools/budget_check.sh
      - name: Scan Go dependencies
        run: |
          GOBIN="$RUNNER_TEMP/bin" go install golang.org/x/vuln/cmd/govulncheck@v1.7.0
          "$RUNNER_TEMP/bin/govulncheck" ./...
      - name: Run repository-specific secret checks
        run: ./tools/secret-scan.sh
      - name: Scan complete tree and history with Gitleaks
        run: ./tools/full-secret-scan.sh
      - name: Verify reproducible release artifacts
        run: ./tools/reproducible-build-check.sh "$GITHUB_REF_NAME"
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
      - name: Test backup and restore in a clean container
        run: ./tools/release-container-smoke.sh "$GITHUB_REF_NAME"
      - name: Build multi-platform image without publishing
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: deploy/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: false
          outputs: type=oci,dest=${{ runner.temp }}/oonfeewrt.oci.tar
          build-args: VERSION=${{ github.ref_name }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Build exact release archives
        run: |
          release_dir="$RUNNER_TEMP/release"
          notes="RELEASE-NOTES-${GITHUB_REF_NAME}.md"
          test -f "$notes"
          ./tools/release-build.sh "$GITHUB_REF_NAME" "$release_dir"
          (cd "$release_dir" && sha256sum --check SHA256SUMS)
          cp "$notes" "$release_dir/RELEASE-NOTES.md"
      - name: Preserve gated release files
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-files
          path: ${{ runner.temp }}/release/*
          if-no-files-found: error
          retention-days: 7

  container:
    name: Multi-platform container
    needs: gate
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - name: Check out tagged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Set image coordinates
        id: image
        env:
          REPOSITORY: ${{ github.repository }}
        run: |
          image="ghcr.io/${REPOSITORY,,}"
          stable="${GITHUB_REF_NAME#v}"
          minor="${stable%.*}"
          echo "name=$image" >> "$GITHUB_OUTPUT"
          echo "version=$GITHUB_REF_NAME" >> "$GITHUB_OUTPUT"
          {
            echo 'tags<<EOF'
            echo "$image:$GITHUB_REF_NAME"
            case "$GITHUB_REF_NAME" in
              *-*) ;;
              *)
                echo "$image:$stable"
                echo "$image:$minor"
                echo "$image:latest"
                ;;
            esac
            echo EOF
          } >> "$GITHUB_OUTPUT"
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
      - name: Sign in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Build and publish image
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: deploy/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.image.outputs.tags }}
          build-args: VERSION=${{ github.ref_name }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ github.ref_name }}
          provenance: mode=max
          sbom: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Sign and verify immutable image digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          IMAGE: ${{ steps.image.outputs.name }}
        run: |
          identity="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/.github/workflows/release.yml@$GITHUB_REF"
          cosign sign --yes "$IMAGE@$DIGEST"
          cosign verify \
            --certificate-identity "$identity" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            "$IMAGE@$DIGEST" >/dev/null
      - name: Verify anonymous multi-platform aliases
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          TAGS: ${{ steps.image.outputs.tags }}
        run: |
          anonymous=$(mktemp -d)
          inspect="$RUNNER_TEMP/oonfeewrt-image-inspect.txt"
          trap 'rm -rf "$anonymous"' EXIT
          while IFS= read -r image; do
            [ -n "$image" ] || continue
            for attempt in 1 2 3 4 5 6; do
              if DOCKER_CONFIG="$anonymous" docker buildx imagetools inspect \
                "$image" > "$inspect"; then
                break
              fi
              if [ "$attempt" -eq 6 ]; then
                echo "release: image is not anonymously readable: $image" >&2
                exit 1
              fi
              sleep 5
            done
            grep -Eq "^Digest:[[:space:]]+$DIGEST([[:space:]]|$)" "$inspect"
            grep -Eq 'Platform:[[:space:]]+linux/amd64([[:space:]]|$)' "$inspect"
            grep -Eq 'Platform:[[:space:]]+linux/arm64([[:space:]]|$)' "$inspect"
          done <<< "$TAGS"

  github-release:
    name: GitHub release
    needs: [gate, container]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Download release files
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-files
          path: dist
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          prerelease=
          case "$GITHUB_REF_NAME" in
            *-*) prerelease=--prerelease ;;
          esac
          # Release and repository names cannot contain shell whitespace;
          # prerelease is either empty or this fixed option.
          # shellcheck disable=SC2086
          gh release create "$GITHUB_REF_NAME" dist/*.tar.gz dist/SHA256SUMS \
            --repo "$GITHUB_REPOSITORY" --verify-tag --title "$GITHUB_REF_NAME" \
            --notes-file dist/RELEASE-NOTES.md $prerelease
